<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:0 auto;padding:24px 16px;line-height:1.6;color:#1a1a1a;background:#fff}
h1,h2{line-height:1.25}a{color:#0b57d0}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}header img{width:56px;height:56px;border-radius:50%}
footer{margin-top:40px;font-size:14px;color:#555;border-top:1px solid #ddd;padding-top:12px}code{background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}
@media (prefers-color-scheme:dark){body{background:#121212;color:#e8e8e8}a{color:#8ab4f8}code{background:#2a2a2a}footer{color:#aaa;border-color:#333}}</style></head><body><header><img src="logo.png" alt="MobileStop logo"><strong>MobileStop</strong></header><h1 id="h">Connecting…</h1><p id="msg">Finishing your TikTok connection…</p><p id="code"></p>
<script>
const q=new URLSearchParams(location.search), c=q.get('code'), e=q.get('error');
const h=document.getElementById('h'), m=document.getElementById('msg');
let api=''; try { api=atob((q.get('state')||'').split('~')[1]||''); } catch(_) {}
function manual(){ h.textContent='Almost done'; m.textContent='TikTok approved the connection. Copy this whole page address and send it to Claude:';
  document.getElementById('code').innerHTML='<code>'+location.href.replace(/</g,'&lt;')+'</code>'; }
if (e) { h.textContent='Not connected'; m.textContent='TikTok returned an error: '+e+' — '+(q.get('error_description')||''); }
else if (!c) { h.textContent='Not connected'; m.textContent='No authorisation code in this link.'; }
else if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(api)) { manual(); }
else fetch(api+'/api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c})})
  .then(r=>r.json().then(d=>({ok:r.ok,d})))
  .then(({ok,d})=>{ if(ok){ h.textContent='Connected ✓'; m.textContent='TikTok account @'+d.username+' is connected to MobileStop Social Publisher. New videos will be sent to you to review and post.'; }
                    else { h.textContent='Not connected'; m.textContent=d.error||'Please try connecting again.'; } })
  .catch(()=>manual());
</script><footer>MobileStop · 162/1, 1st Cross Street, Colombo 11, Sri Lanka · Hotline 077 734 9834 · mobilestopcolombo@gmail.com<br><a href="index.html">Home</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></footer></body></html>
